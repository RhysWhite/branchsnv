name: Strict documentation build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mkdocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Read the Docs dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --upgrade mkdocs
          python -m pip install -r docs/requirements.txt
      - name: Build documentation in strict mode
        run: python -m mkdocs build --strict --clean --config-file mkdocs.yml --site-dir "$RUNNER_TEMP/mkdocs-site"
